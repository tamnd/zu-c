name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The whole kit against the engine at its own HEAD, which is what
  # makes a red job here mean this wrapper is wrong about the ABI rather
  # than that a checked-in copy of something is stale. Two compilers,
  # because the header is where a difference between them shows up and a
  # header-only library has no build of its own to catch it first.
  engine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
          - os: macos-latest
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: tamnd/zu
          path: engine

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - uses: lukka/get-cmake@latest

      # zu.h is not vendored here, so there is no copy to drift. What
      # can drift is the revision this wrapper was written against,
      # which CMakeLists warns about at configure time and which is
      # worth failing on rather than warning about in CI.
      - name: The ABI this wrapper speaks is the ABI the engine offers
        run: |
          set -eu
          engine_abi="$(sed -n 's/^#define ZU_ABI_VERSION "\(.*\)"$/\1/p' \
              engine/crates/zu-capi/include/zu.h)"
          client_abi="$(sed -n 's/.*VERSION_EQUAL "\(.*\)")$/\1/p' CMakeLists.txt)"
          test -n "$engine_abi"
          test -n "$client_abi"
          echo "engine $engine_abi, wrapper $client_abi"
          test "$engine_abi" = "$client_abi"

      - name: Build libzu
        working-directory: engine
        run: cargo build --release -p zu-capi

      # -Werror here and nowhere else. A user compiling the header with
      # a warning flag this repository has never heard of should get a
      # warning, not a failure; this repository's own code is held to
      # the stricter line.
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DZU_ROOT="$GITHUB_WORKSPACE/engine"
          -DZU_CPP_WERROR=ON

      - name: Build
        run: cmake --build build

      # The suite and every example, twice over: each test file is built
      # once at C++23 and once at the C++20 floor, and ctest runs both.
      - name: Test
        run: ctest --test-dir build --output-on-failure -j2

      # Not for the numbers, which mean nothing on a shared runner, but
      # because a benchmark is code that nothing else compiles. A
      # benchmark that stopped building is a benchmark nobody will run
      # again.
      - name: Build the benchmarks
        run: cmake --build build --target bench

  # The same thing with the sanitizers on. The wrapper hands raw
  # pointers and lengths to a library it does not own, so a lifetime it
  # got wrong is a read of somebody else's memory rather than an
  # exception, and this is the job that finds it.
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: tamnd/zu
          path: engine

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - uses: lukka/get-cmake@latest

      - name: Build libzu
        working-directory: engine
        run: cargo build --release -p zu-capi

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DZU_ROOT="$GITHUB_WORKSPACE/engine"
          -DZU_CPP_SANITIZE=address,undefined
        env:
          CC: clang
          CXX: clang++

      - name: Build
        run: cmake --build build

      # Leak detection off, because libzu is not instrumented and a
      # leak reported inside it is a report about the engine's
      # allocator rather than about this wrapper. The engine has its
      # own suites for that. What is on here is the part this
      # repository can be wrong about: bounds, lifetime, and undefined
      # behaviour on the C++ side of the boundary.
      - name: Test
        run: ctest --test-dir build --output-on-failure -j2
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

      # And the C misuse suite once more with leak detection on, which
      # the rest of the suite cannot have. The reason it can is that it
      # is the one file here that gives everything back by hand: no
      # destructor runs on its behalf, so a handle it failed to close is
      # a leak it is responsible for rather than one the wrapper hid.
      #
      # This is what makes "no leak" in the misuse item a checked thing
      # rather than a claim. LSan counts every malloc it sees, including
      # the ones inside libzu, which is uninstrumented but not invisible,
      # so a connection or a result the suite dropped is caught here even
      # though the allocation happened on the other side of the ABI.
      - name: The misuse suite gives everything back
        run: ./build/test/misuse
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  # Races, which are the failure the address sanitizer cannot see and
  # the one an ABI used from four threads is most likely to have.
  #
  # gcc rather than clang, because the suppression file below was
  # measured against gcc's libtsan and a suppression nobody checked is
  # worse than no suppression at all.
  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: tamnd/zu
          path: engine

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - uses: lukka/get-cmake@latest

      - name: Build libzu
        working-directory: engine
        run: cargo build --release -p zu-capi

      - name: Configure
        run: >
          cmake -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DZU_ROOT="$GITHUB_WORKSPACE/engine"
          -DZU_CPP_SANITIZE=thread
        env:
          CC: gcc
          CXX: g++

      - name: Build the threading suite
        run: cmake --build build-tsan --target threads

      # Only the threading suite, because it is the only file here that
      # starts a thread. The rest of the tree under TSan would be a
      # slower way of compiling code that never races.
      #
      # The suppression file says at length why the engine's own frames
      # are dropped: libzu takes no pthread lock, so TSan has no edge to
      # learn from and reports two threads as racing even when one of
      # them plainly waited. What is left is this repository's half,
      # and it is checked rather than assumed: a race planted in the
      # suite's own memory is still reported with these suppressions on.
      - name: The threading rule holds when it is kept
        run: ./build-tsan/test/threads
        env:
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/test/tsan.supp:halt_on_error=1

  # And memcheck, which sees what the sanitizers do not: an
  # uninstrumented library's own reads and writes. libzu is compiled by
  # cargo without instrumentation, so ASan knows nothing about what it
  # does between the malloc and the free that it intercepts, and
  # valgrind knows all of it.
  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: tamnd/zu
          path: engine

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - uses: lukka/get-cmake@latest

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Build libzu
        working-directory: engine
        run: cargo build --release -p zu-capi

      - name: Configure
        run: >
          cmake -B build-vg -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DZU_ROOT="$GITHUB_WORKSPACE/engine"

      - name: Build the C suites
        run: cmake --build build-vg --target misuse threads

      # The two C files, because they are the ones that hand raw
      # pointers across and give everything back by hand.
      #
      # Definitely lost is an error. Indirectly lost is shown and not
      # counted, because an indirectly lost block is by definition one
      # hanging off a definitely lost block: count the root and the
      # children come with it, and a leak that had no root would not be
      # indirect. It is the spelling that lets the five roots the engine
      # keeps be suppressed by name in test/memcheck.supp rather than by
      # a rule about libzu.so wide enough to hide this job's own point.
      # Possibly lost is not an error either: it is one block of 180
      # bytes, it belongs to a thread the library started, and a pointer
      # into the middle of a block is how a thread-local arena looks to
      # a leak checker rather than how a leak looks.
      #
      # This used to set ZU_TEST_ROWS to 300, to shrink the two fixtures
      # that exist in order to be slow, on the reasoning that memcheck
      # runs the machine forty times slower and that is another way of
      # getting a statement long enough to be watched and interrupted.
      # The arithmetic does not work: the statement counts pairs, so a
      # tenth of the rows is a hundredth of the work, and a hundredth
      # slowed by forty is shorter than the whole fixture is natively.
      # The watcher never fired, and the case that says it fired is the
      # one that has been red here since this job was added. The whole
      # fixture runs now and this job costs a minute more.
      - name: The C suites under memcheck
        run: |
          set -eu
          for t in misuse threads; do
            valgrind --error-exitcode=99 --leak-check=full \
              --show-leak-kinds=definite,indirect \
              --errors-for-leak-kinds=definite \
              --suppressions=test/memcheck.supp \
              --track-origins=yes "./build-vg/test/$t"
          done

  # The reference, built the same way the release builds it, and graded
  # rather than glanced at.
  #
  # No engine on this one, which is why it is thirty seconds rather than
  # ten minutes: the reference is about the header, and the header is
  # here whether a library was built or not.
  #
  # ctest rather than the docs target, because they run the same script
  # and this is the spelling that fails the job. Doxygen exits 0 on a
  # header it read nothing out of, so a step that only ran Doxygen would
  # be a green job over an empty reference, which is exactly what
  # happened once. docs/reference.py says what that check is.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: lukka/get-cmake@latest

      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Configure
        run: cmake -B build -DZU_CPP_DOCS=ON

      - name: Every type the header declares has a page and no member is bare
        run: ctest --test-dir build -R reference --output-on-failure

      # The rules the surface gate rests on, before the gate that rests
      # on them. These need neither Doxygen nor the header, and they run
      # first because a wrong rule makes the gate below pass rather than
      # fail, which is the failure that would not be reported.
      - name: What identifies a declaration, and what is only its shape
        run: ctest --test-dir build -R surface-cases --output-on-failure

      # api/surface.txt is a reviewed file. This is what tells a
      # reviewer it should have been in the diff.
      - name: The published surface is still what api/surface.txt says
        run: ctest --test-dir build -R '^surface$' --output-on-failure

      # So that a reviewer can read the page a change to a comment
      # produced rather than take the diff's word for it.
      - uses: actions/upload-artifact@v4
        with:
          name: reference
          path: build/docs/reference/html
          if-no-files-found: error

  # The claim the packaging makes is that a project that installed this
  # can find it. Nothing in the suite can check that, because the suite
  # is inside the build tree and finds the header by being next to it.
  # So it is checked here, once, the way a user meets it.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: tamnd/zu
          path: engine

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - uses: lukka/get-cmake@latest

      - name: Build libzu
        working-directory: engine
        run: cargo build --release -p zu-capi

      - name: Install into a prefix
        run: |
          set -eu
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DZU_ROOT="$GITHUB_WORKSPACE/engine" \
            -DZU_CPP_TESTS=OFF -DZU_CPP_EXAMPLES=OFF -DZU_CPP_BENCH=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/prefix"
          cmake --build build --target install

      - name: Build a project that found it
        run: |
          set -eu
          cmake -S cmake/consumer -B consumer-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/prefix" \
            -DZU_ROOT="$GITHUB_WORKSPACE/engine"
          cmake --build consumer-build
          ./consumer-build/consumer
